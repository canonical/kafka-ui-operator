# Concierge configuration for the OAuth tests, which need both substrates.
juju:
  channel: 3.6/stable
  model-defaults:
    logging-config: <root>=INFO; unit=DEBUG

providers:
  lxd:
    enable: true
    bootstrap: true
    channel: latest/stable

  k8s:
    enable: true
    bootstrap: false
    channel: 1.32-classic/stable
    features:
      local-storage:
      load-balancer:
        enabled: true
        l2-mode: true
        cidrs: "10.43.45.0/28"

host:
  snaps:
    charmcraft:
      channel: 3.x/stable
